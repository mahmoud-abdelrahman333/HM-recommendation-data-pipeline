services:

  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    volumes:
      - namenode:/tmp/hadoop-root/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    ports:
      - "9870:9870"
      - "8020:8020"
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-root/dfs/name &&
      if [ ! -f /tmp/hadoop-root/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force;
      fi &&
      hdfs namenode
      "
    networks:
      - hm

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    user: root
    volumes:
      - datanode:/tmp/hadoop-root/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    ports:
      - "9864:9864"
    command: >
      bash -c "
      mkdir -p /tmp/hadoop-root/dfs/data &&
      hdfs datanode
      "
    depends_on:
      - namenode
    networks:
      - hm

  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - hm

  spark:
    image: apache/spark:3.5.7
    container_name: spark
    hostname: spark
    user: root
    volumes:
      - ./spark:/opt/spark/work
      - ./hadoop/core-site.xml:/opt/spark/conf/core-site.xml
      - ./hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml
    command: tail -f /dev/null
    depends_on:
      - namenode
      - datanode
    networks:
      - hm

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: hm_recommendations
      POSTGRES_USER: hm_user
      POSTGRES_PASSWORD: hm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hm

  api:
    build: ./web
    container_name: hm-api
    hostname: api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - hm

volumes:
  namenode:
  datanode:
  kafka-data:
  postgres-data:

networks:
  hm:
    driver: bridge
